global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ai-platform
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal resolves to the host machine from inside a
      # container on Docker Desktop (Windows/Mac) - for the `mvn
      # spring-boot:run`-on-the-host workflow every earlier phase's docs
      # use. On native Linux Docker, host.docker.internal isn't defined by
      # default - see docker-compose.yml's extra_hosts for the one-line fix.
      - targets: ["host.docker.internal:8080"]
        labels:
          deployment: host
      # Phase 16: the containerized app, when started via
      # `docker compose --profile full up`. Reachable by its Compose service
      # name ("app") from within the same Compose network. Harmless if this
      # profile isn't running - Prometheus just shows this target as down,
      # same as any other scrape target that's temporarily unavailable.
      - targets: ["app:8080"]
        labels:
          deployment: container
