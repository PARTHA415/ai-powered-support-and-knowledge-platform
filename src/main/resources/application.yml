spring:
  application:
    name: ai-platform
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.7}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    chat:
      observations:
        # Never log prompt/completion content - these are potentially
        # sensitive support conversations, not debug fixtures. Explicit here
        # rather than relying silently on Spring AI's own (also-false)
        # default, so the decision is visible in config, not just assumed.
        log-prompt: false
        log-completion: false
        include-error-logging: true
    mcp:
      server:
        name: ai-platform-mcp-server
        version: 1.0.0
        protocol: streamable
        type: sync
        instructions: >
          Support-platform MCP server exposing order, payment, customer, and
          knowledge-base lookup tools. Every tool call is authenticated and
          authorized exactly like the equivalent REST endpoint - MCP is a new
          transport for these capabilities, not a new trust boundary.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_platform}
    username: ${DB_USERNAME:ai_platform}
    password: ${DB_PASSWORD:ai_platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

app:
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:800}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
  agent:
    max-iterations: ${AGENT_MAX_ITERATIONS:5}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:30}
  memory:
    max-messages: ${MEMORY_MAX_MESSAGES:20}
    ttl-hours: ${MEMORY_TTL_HOURS:24}
  guardrails:
    max-tool-calls-per-request: ${GUARDRAILS_MAX_TOOL_CALLS:20}
    max-prompt-tokens: ${GUARDRAILS_MAX_PROMPT_TOKENS:6000}
  mcp:
    demo-client:
      base-url: ${MCP_DEMO_CLIENT_BASE_URL:http://localhost:${server.port}}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # health and prometheus only - actuator exposes a lot more (env,
        # beans, configprops...) that can itself leak secrets/config if
        # opened up carelessly; nothing beyond these two is needed here.
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[gen_ai.client.operation.duration]": true
        "[spring.ai.tool]": true
        "[rag.vector.search]": true

logging:
  level:
    com.example.aiplatform: DEBUG
  pattern:
    # %X{correlationId} pulls the per-request ID CorrelationIdFilter puts in
    # MDC - present on every log line for the life of the request, which is
    # what makes "REST -> RAG -> Vector DB -> LLM -> Tool -> Response" for
    # ONE request greppable as one story instead of interleaved noise.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"
