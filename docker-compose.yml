services:
  # Phase 16: the application itself, containerized - opt-in via
  # `docker compose --profile full up --build`, deliberately NOT started by
  # a plain `docker compose up` (every earlier phase's docs assume that
  # command brings up just the infra services, then `mvn spring-boot:run`
  # runs the app on the host - changing that default would break every one
  # of those instructions). Both ways of running the app work side by side.
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_platform}
      DB_USERNAME: ${POSTGRES_USER:-ai_platform}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ai_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Required, no default (see application.yml) - must be set in the
      # shell environment or a .env file next to this compose file; never
      # committed, never baked into the image (Phase 16's secrets-management
      # review - see the docs for the AWS Secrets Manager equivalent).
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # The demo accounts (alice/bob/carol/dave, password "password") are
      # seeded ONLY under the dev profile - see data-dev.sql. This compose
      # file IS the local development environment, so it opts in by default;
      # a real deployment does not set this, gets an empty app_user table,
      # and provisions its own accounts. Override with SPRING_PROFILES_ACTIVE
      # to run this stack without the demo logins.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ai_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 14: scrapes the application's /actuator/prometheus endpoint. The
  # app itself runs on the host (mvn spring-boot:run), not in this compose
  # file, hence prometheus.yml targeting host.docker.internal:8080.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Makes host.docker.internal resolve on native Linux Docker too, not
      # just Docker Desktop (Windows/Mac), where it works out of the box.
      - "host.docker.internal:host-gateway"

  # Phase 14: pre-provisioned with the Prometheus datasource and the
  # "AI Platform Overview" dashboard - open http://localhost:3000
  # (admin/admin on first login) and it's already there, no manual setup.
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
